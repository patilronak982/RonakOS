<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142a52">
<title>Ronak OS — Mini Smartphone</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f8ff;background:#10131b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px}
button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation;color:inherit}
.phone{width:min(100%,390px);background:#151923;border:3px solid #353b4b;border-radius:40px;padding:10px;box-shadow:0 16px 45px #0007}
.speaker{height:17px;display:flex;justify-content:center;align-items:center}.speaker:after{content:"";width:66px;height:9px;border-radius:9px;background:#05070b}
.screen{min-height:640px;height:min(76vh,760px);min-height:min(640px,76vh);overflow:hidden;border-radius:28px;padding:14px;display:flex;flex-direction:column;background:linear-gradient(155deg,#142a52,#624ba2 55%,#d07aa0);transition:background .2s}
.status{display:flex;justify-content:space-between;font-size:12px;padding:0 4px}
.content{flex:1;min-height:0;overflow:auto;padding-bottom:8px}
.clock{text-align:center;margin:35px 0 20px}.bigtime{font-size:50px;font-weight:200;letter-spacing:-2px}.date{font-size:13px}
.welcome,.widget,.panel{background:#ffffff20;border:1px solid #ffffff30;border-radius:17px;padding:13px;margin-bottom:15px}
.welcome .small{font-size:11px}.welcome .brand{font-size:23px;font-weight:800}.welcome .tag{font-size:12px}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px 8px}
.app{border:0;background:transparent;display:flex;align-items:center;flex-direction:column;gap:5px;font-size:11px;min-width:0}
.appicon{width:49px;height:49px;border-radius:15px;display:grid;place-items:center;font-size:24px;box-shadow:inset 0 1px 2px #ffffff50}
.widget{margin-top:20px;font-size:12px}
.nav{display:flex;justify-content:center;gap:28px;align-items:center;padding:10px 0 2px}
.nav button{background:transparent;border:0;font-size:20px;min-width:25px;height:27px}
.homecircle{border:2px solid #ffffffb0!important;width:24px;height:24px!important;border-radius:50%;min-width:24px!important}
h2{font-size:22px;margin:18px 0 15px}p{font-size:13px;line-height:1.5}
.btn{background:#ffffff20;border:1px solid #ffffff35;border-radius:12px;padding:10px 12px;font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.field{width:100%;border:0;border-radius:10px;padding:11px;background:#ffffffed;color:#172038;outline:2px solid transparent;font-size:14px;margin:4px 0}
textarea.field{resize:vertical}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.pad button{background:#ffffff20;border:1px solid #ffffff30;border-radius:10px;padding:11px}
.calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.calcgrid button{background:#ffffff20;border:1px solid #ffffff30;border-radius:10px;padding:11px}
.result{font-size:12px;line-height:1.5;margin-top:12px;overflow-wrap:anywhere}.fineprint{text-align:center;color:#b6bfd2;font-size:9px;letter-spacing:3px;padding:9px 0 1px}
a{color:#fff}button:active{filter:brightness(.85);transform:translateY(1px)}
@media(max-height:720px){.screen{height:calc(100dvh - 95px);min-height:500px}.clock{margin:18px 0}.bigtime{font-size:42px}}
</style>
</head>
<body>
<div class="phone">
  <div class="speaker"></div>
  <main class="screen" id="screen">
    <div class="status"><span id="statusTime">9:41</span><span>● ▮▮▮ ▰</span></div>
    <div class="content" id="content"></div>
    <nav class="nav" aria-label="Phone navigation">
      <button id="back" aria-label="Back">‹</button>
      <button id="home" class="homecircle" aria-label="Home"></button>
      <button id="recent" aria-label="Recent apps">▢</button>
    </nav>
  </main>
  <div class="fineprint">RONAK • SMART SERIES</div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const screen = $('screen'), content = $('content');
  let page='home', previous='home', notes='', calc='', phoneNo='', message='', browserUrl='', brightness=100;
  const appList = [
    ['phone','☎','Phone','#39bd7b'],['messages','✉','Messages','#43b8e8'],
    ['browser','◎','Browser','#e9a14a'],['camera','▣','Camera','#8873ed'],
    ['notes','✎','Notes','#f0c64b'],['calculator','＋','Calculator','#58b6a9'],
    ['games','🎮','Games','#e76b86'],['settings','⚙','Settings','#788aa5'],
    ['about','ⓘ','About','#567bd5']
  ];
  const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function clock(){
    const d=new Date();
    $('statusTime').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const t=$('bigtime'), date=$('date');
    if(t)t.textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    if(date)date.textContent=d.toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'});
  }
  function button(label,action){return `<button class="btn" data-action="${action}">${label}</button>`}
  function field(id,placeholder,value='',type='text'){return `<input class="field" id="${id}" placeholder="${placeholder}" value="${esc(value)}" type="${type}">`}
  function shell(title,html){content.innerHTML=`<h2>${title}</h2>${html}`;clock()}
  function home(){
    page='home';
    content.innerHTML=`
      <div class="clock"><div class="bigtime" id="bigtime"></div><div class="date" id="date"></div></div>
      <div class="welcome"><div class="small">WELCOME TO</div><div class="brand">RONAK OS</div><div class="tag">Your phone. Your world.</div></div>
      <div class="apps">${appList.map(([id,icon,name,color])=>`<button class="app" data-app="${id}"><span class="appicon" style="background:${color}">${icon}</span>${name}</button>`).join('')}</div>
      <div class="widget">✨ <b>Daily reminder</b><br>Make today count, one step at a time.</div>`;
    clock();
  }
  function open(id){
    previous=page; page=id;
    if(id==='home'){home();return}
    if(id==='phone')shell('☎ Phone',`<p>Demo dialer — no real calls are placed.</p>${field('rpnumber','Enter a phone number',phoneNo,'tel')}<div class="pad">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>`<button data-digit="${n}">${n}</button>`).join('')}</div><div class="btnrow">${button('☎ Simulate call','call')}${button('⌫ Delete','delete')}</div><div id="result" class="result"></div>`);
    if(id==='messages')shell('✉ Messages',`<p>Write a demo SMS. It will not be sent.</p>${field('rpmsgto','Recipient name or number')}<textarea id="rpmsg" class="field" rows="4" placeholder="Type your message...">${esc(message)}</textarea><div class="btnrow">${button('Preview message','preview')}</div><div id="result" class="result"></div>`);
    if(id==='browser')shell('◎ Browser',`<p>Enter a website to open it in a new browser tab.</p>${field('rpurl','example.com',browserUrl,'text')}<div class="btnrow">${button('Open website','browse')}</div><p>Only open websites you trust. This demo does not include a built-in web engine.</p><div id="result" class="result"></div>`);
    if(id==='camera')shell('▣ Camera',`<p>This website cannot directly replace your camera app. Use the button below to try opening your device camera.</p><div class="btnrow">${button('Open camera','camera')}</div><div id="result" class="result"></div>`);
    if(id==='notes')shell('✎ Notes',`<p>Notes stay in this browser session. Copy anything important elsewhere.</p><textarea id="rpnote" class="field" rows="7" placeholder="Write your ideas here...">${esc(notes)}</textarea><div class="btnrow">${button('Save note','save')}${button('Copy note','copynote')}</div><div id="result" class="result"></div>`);
    if(id==='calculator')shell('＋ Calculator',`<p>Basic arithmetic calculator.</p>${field('rpcalc','e.g. (12+8)*3',calc)}<div class="calcgrid">${['7','8','9','/','4','5','6','*','1','2','3','-','0','.','⌫','+','(',')','%','='].map(n=>`<button data-calc="${n}">${n}</button>`).join('')}</div><div id="result" class="result"></div>`);
    if(id==='games')shell('🎮 Mini games',`<div class="panel"><b>Pixel Arcade</b><p>Want to play retro games? Open the standalone arcade if you saved it separately, or return to the chat where it was created.</p>${button('Back to home','home')}</div>`);
    if(id==='settings')shell('⚙ Settings',`<div class="panel"><div style="font-size:12px;opacity:.8">DEVICE INFORMATION</div><p style="margin-bottom:0"><b>Device name - pineapple youphone</b></p></div><p>Wallpaper</p><div class="btnrow">${button('🌌 Purple','purple')}${button('🌊 Ocean','ocean')}${button('🌿 Forest','forest')}${button('🌅 Sunset','sunset')}</div><p>Screen brightness</p><input id="brightness" class="field" style="padding:0" type="range" min="55" max="100" value="${brightness}"><p>These settings change this demo screen only, not your actual phone.</p>`);
    if(id==='about')shell('ⓘ About Ronak OS',`<div class="panel"><b>Ronak OS 1.0</b><p>Interactive mini smartphone simulator.</p><p>Includes 9 demo apps and touch-friendly controls.</p><p>This is a website, not a full Android operating system. It cannot install Android apps, access mobile networks, or change your device settings.</p></div>`);
    clock();
  }
  function act(a){
    const r=$('result');
    if(a==='home'){home();return}
    if(a==='back'){if(page==='home')return;home();return}
    if(a==='recent'){shell('Recent apps',`<p>Last app opened: ${esc(appList.find(x=>x[0]===previous)?.[2]||'Home')}</p>${button('Return home','home')}`);return}
    if(a==='call'){phoneNo=$('rpnumber')?.value||'';if(r)r.textContent=phoneNo?`Call simulation: ${phoneNo}. No real call was placed.`:'Enter a number first.';return}
    if(a==='delete'){const el=$('rpnumber');if(el){el.value=el.value.slice(0,-1);phoneNo=el.value}return}
    if(a==='preview'){message=$('rpmsg').value;if(r)r.innerHTML=`<b>Message preview</b><br>To: ${esc($('rpmsgto').value||'(no recipient)')}<br>${esc(message||'(empty message)')}<br><small>Not sent.</small>`;return}
    if(a==='browse'){
      browserUrl=$('rpurl').value.trim();if(!browserUrl){r.textContent='Enter a website address.';return}
      try{const u=new URL(/^https?:\/\//i.test(browserUrl)?browserUrl:'https://'+browserUrl);if(!['https:','http:'].includes(u.protocol))throw 0;r.textContent='Opening '+u.hostname+' in a new tab.';window.open(u.href,'_blank','noopener,noreferrer')}catch(e){r.textContent='That website address is not valid.'}return
    }
    if(a==='camera'){r.textContent='If your browser allows it, use the link below to open the camera capture chooser.';r.innerHTML+=' <label class="btn" style="display:inline-block">Take photo<input type="file" accept="image/*" capture="environment" style="display:none" id="photo"></label>';return}
    if(a==='save'){notes=$('rpnote').value;r.textContent='Note saved for this open session.';return}
    if(a==='copynote'){notes=$('rpnote').value;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(notes).then(()=>r.textContent='Note copied.').catch(()=>r.textContent='Copy was blocked by the browser.');else r.textContent='Clipboard is not available in this browser.';return}
    const wallpapers={
      purple:'linear-gradient(155deg,#142a52,#624ba2 55%,#d07aa0)',
      ocean:'linear-gradient(155deg,#063c63,#168aad,#70d6ff)',
      forest:'linear-gradient(155deg,#123b2c,#28784c,#9bcf87)',
      sunset:'linear-gradient(155deg,#572c65,#d15d67,#f7b267)'
    };
    if(wallpapers[a]){screen.style.background=wallpapers[a];return}
  }
  content.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.app){open(b.dataset.app);return}
    if(b.dataset.action){act(b.dataset.action);return}
    if(b.dataset.digit){const el=$('rpnumber');if(el)el.value+=b.dataset.digit;return}
    if(b.dataset.calc){
      const el=$('rpcalc');if(!el)return;const n=b.dataset.calc;
      if(n==='⌫'){el.value=el.value.slice(0,-1);calc=el.value;return}
      if(n==='='){
        try{const expr=el.value;if(!/^[0-9+\-*/(). %]+$/.test(expr)||!/[0-9]/.test(expr))throw 0;
          const val=Function('"use strict";return ('+expr+')')();if(!Number.isFinite(val))throw 0;
          el.value=String(val);calc=el.value;$('result').textContent='Result: '+calc;
        }catch(err){$('result').textContent='Invalid calculation'}return
      }
      el.value+=n;calc=el.value;
    }
  });
  content.addEventListener('input',e=>{
    if(e.target.id==='brightness'){brightness=Number(e.target.value);screen.style.filter=`brightness(${brightness}%)`}
    if(e.target.id==='rpnote')notes=e.target.value;
    if(e.target.id==='rpcalc')calc=e.target.value;
    if(e.target.id==='rpnumber')phoneNo=e.target.value;
    if(e.target.id==='rpmsg')message=e.target.value;
    if(e.target.id==='rpurl')browserUrl=e.target.value;
  });
  $('back').addEventListener('click',()=>act('back'));
  $('home').addEventListener('click',()=>act('home'));
  $('recent').addEventListener('click',()=>act('recent'));
  home();setInterval(clock,15000);
})();
</script>
</body>
                                                    </html>
